name: Manual D1 migration and Worker deployment

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "I reviewed the migration SQL against the live database and explicitly approve applying it to the existing D1 database."
        required: true
        type: boolean
        default: false
      deploy_worker:
        description: "I explicitly approve deploying the Worker."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: interview-research-production
  cancel-in-progress: false

jobs:
  migration-review:
    if: inputs.apply_migrations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Validate migration SQL without connecting to production
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path("migrations").glob("*.sql"))
          if not files:
              raise SystemExit("No migration SQL files found")
          for file in files:
              sql = file.read_text()
              if "DROP TABLE" in sql.upper() or "DELETE FROM" in sql.upper():
                  raise SystemExit(f"Destructive SQL detected in {file}")
              print(f"Reviewed file exists: {file}")
          PY
      - name: Apply D1 migrations (explicitly opted in)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply interview-12 --remote

  deploy-worker:
    needs: [migration-review]
    if: ${{ always() && inputs.deploy_worker && (needs.migration-review.result == 'success' || needs.migration-review.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Run local tests
        run: npm test
      - name: Deploy Worker (explicitly opted in)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
