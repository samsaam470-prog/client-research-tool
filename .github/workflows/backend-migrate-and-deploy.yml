name: Backend - Validate, Migrate and Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Apply migrations to the production D1 database and deploy the Worker"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: interview-12-backend-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    runs-on: ubuntu-latest
    environment: production
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply additive D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute interview-12 --remote --file=migrations/0001_create_public_tokens_and_pages.sql
          npx wrangler d1 execute interview-12 --remote --file=migrations/0002_create_versions_and_publish_state.sql
          npx wrangler d1 execute interview-12 --remote --file=migrations/0003_seed_existing_questionnaire_state.sql
          npx wrangler d1 execute interview-12 --remote --file=migrations/0004_immutable_version_questions.sql
      - name: Deploy Worker after migrations succeed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
