name: Backend - Migrate and Deploy interview-12

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'migrations/**'
      - '【entity-wrangler¦canonical_name=wrangler】.toml'
      - 'package.json'
      - '.github/workflows/backend-migrate-and-deploy.yml'
  workflow_dispatch:

jobs:
  migrate:
    name: Apply D1 Migrations (idempotent, non-destructive)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install 【entity-Wrangler¦canonical_name=wrangler】
        run: npm install -g 【entity-wrangler¦canonical_name=wrangler】

      - name: Apply migration 0001
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Applying 0001_create_public_tokens_and_pages.sql"
          【entity-wrangler¦canonical_name=wrangler】 d1 execute interview-12 --remote --file=./migrations/0001_create_public_tokens_and_pages.sql

      - name: Apply migration 0002
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Applying 0002_create_versions.sql"
          【entity-wrangler¦canonical_name=wrangler】 d1 execute interview-12 --remote --file=./migrations/0002_create_versions.sql

      - name: Apply migration 0003
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Applying 0003_seed_INT-001_token.sql"
          【entity-wrangler¦canonical_name=wrangler】 d1 execute interview-12 --remote --file=./migrations/0003_seed_INT-001_token.sql

  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci || npm install

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/【entity-wrangler¦canonical_name=wrangler】-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Post-deploy backfill tokens (secure random)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Tokens are generated inside Worker on first create + via backfill endpoint"
          echo "To backfill now: curl -X POST https://interview-12-backend.YOUR_SUBDOMAIN.workers.dev/api/interviews/INT-001/admin/backfill-tokens"